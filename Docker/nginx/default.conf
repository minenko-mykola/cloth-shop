server {
    listen 80;
    server_name localhost;

    # Максимальний розмір тіла запиту (для завантаження картинок/файлів)
    client_max_body_size 20M;

    # Спільні налаштування для всіх проксі-запитів
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- 1. Frontend (Next.js) ---
    location / {
        proxy_pass http://frontend:3000;

        # Підтримка WebSockets для Next.js (Hot Reload)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    # --- 2. API Gateway Section ---
    # Усі сервіси доступні через префікс /api/
    # Замикаючий слеш у proxy_pass видаляє префікс при передачі сервісу

    # Main Backend
    location /api/main/ {
        proxy_pass http://backend:5000/;
    }

    # Analytics Service
    location /api/analytics/ {
        proxy_pass http://analytics-service:8001/;
    }

    # Notification Service
    location /api/notifications/ {
        proxy_pass http://notification-service:8002/;
    }

    # Search Indexer
    location /api/search/ {
        proxy_pass http://search-indexer:8003/;
    }

    # Shop API
    location /api/shop/ {
        proxy_pass http://shop-api:8004/;
    }

    # --- 3. Інструменти та Адмін-панелі ---

    # Kibana
    location /kibana/ {
        proxy_pass http://kibana:5601/;
    }

    # EspoCRM
    location /crm/ {
        proxy_pass http://espocrm/;
    }

    # Kafka UI
    location /kafka-ui/ {
        proxy_pass http://kafka-ui:8080/;
    }

    # --- 4. Обробка помилок (опціонально) ---
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}