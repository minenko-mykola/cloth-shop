server {
    listen 80;
    server_name cloth-shop.com www.cloth-shop.com;

    # Максимальний розмір тіла запиту (для завантаження картинок/файлів)
    client_max_body_size 20M;

    # Спільні налаштування для всіх проксі-запитів
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- 1. Frontend (Next.js) ---
    location / {
        proxy_pass http://frontend:3000;

        # Підтримка WebSockets для Next.js (Hot Reload)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://gateway:5000/;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service:8001/;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:8002/;
    }

    location /api/products/ {
            proxy_pass http://products-service:8003/;
    }

    location /api/search-indexer/ {
        proxy_pass http://search-indexer:8005/;
    }

    location /api/authentication/ {
            proxy_pass http://users-service:8006/;
    }

    location /kibana/ {
        proxy_pass http://kibana:5601/;
    }

    location /crm/ {
        proxy_pass http://espocrm/;
    }

    location /kafka-ui/ {
        proxy_pass http://kafka-ui:8080/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}