[job-exec "run-search-reindex"]
schedule = @every 30m
container = shop-api
command = curl -X POST -H "Authorization: Bearer ${CRON_SECRET}" http://localhost:3000/api/cron/reindex

; Перевірка статусів волонтерів (через Shop-API в Kafka)
[job-exec "check-volunteers"]
schedule = 0 0 9,18 * * *
container = shop-api
command = curl -X POST -H "Authorization: Bearer ${CRON_SECRET}" http://localhost:3000/api/cron/verify-volunteers

[job-exec "cleanup-analytics"]
schedule = @midnight
container = analytics-service
command = npm run db:cleanup