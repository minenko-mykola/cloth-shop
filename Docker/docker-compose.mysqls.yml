services:
  cloth-shop-db:
    image: mysql:8.0
    container_name: cloth-shop-db
    restart: always
    environment:
      - MYSQL_DATABASE=cloth_shop
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ROOT_HOST=%
    ports:
      - "3307:3306"
    volumes:
      - ./dumps/dump-cloth-shop-202512231640.sql:/docker-entrypoint-initdb.d/import.sql
      - cloth_shop_db_data:/var/lib/mysql # Окремий том
    networks:
      - elk-net

  espocrm-db:
    image: mysql:8.0
    container_name: espocrm-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=espocrm_db
    ports:
      - "3308:3306"
    volumes:
      - espocrm_db_data:/var/lib/mysql
      - ./mysql/mysql.cnf:/etc/mysql/mysql.cnf
    networks:
      - elk-net

volumes:
  cloth_shop_db_data:
  espocrm_db_data:

networks:
  local-kafka:
    name: local-kafka-shared # Явно вказуємо назву, щоб уникнути префіксів папок
    driver: bridge
  elk-net:
    external: true # Вказуємо, що мережа вже створена
    name: elk-network