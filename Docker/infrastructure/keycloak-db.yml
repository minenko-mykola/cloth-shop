services:
  keycloak-db:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_DATABASE: keycloak_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3309:3306"

    volumes:
      #      - ../dumps/dump-cloth-shop-202512231640.sql:/docker-entrypoint-initdb.d/init.sql
      - keycloak_db_data:/var/lib/mysql

    networks:
      - backend-network

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  keycloak_db_data:
    name: keycloak-db-data

networks:
  backend-network:
    driver: bridge