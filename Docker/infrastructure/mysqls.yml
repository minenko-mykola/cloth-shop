services:

  cloth-shop-db:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_DATABASE: cloth_shop
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3307:3306"

    volumes:
#      - ../dumps/dump-cloth-shop-202512231640.sql:/docker-entrypoint-initdb.d/init.sql
      - cloth_shop_db_data:/var/lib/mysql

    networks:
      - backend-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  espocrm-db:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_DATABASE: espocrm_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3308:3306"

    volumes:
      - espocrm_db_data:/var/lib/mysql

    networks:
      - backend-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  cloth_shop_db_data:
    name: cloth-shop-db-data

  espocrm_db_data:
    name: espocrm-db-data


networks:
  backend-network:
    driver: bridge