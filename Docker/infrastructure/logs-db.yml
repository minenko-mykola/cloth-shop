services:
  # MongoDB
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD","mongosh","mongodb://user:root@mongodb:27017/admin","--eval","db.runCommand({ping:1})"]
      retries: 5
      timeout: 5s
      interval: 10s

  # Mongo Express
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://user:root@mongodb:27017/admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      - mongodb
    networks:
      - backend-network

volumes:
  mongodb_data:
    driver: local

networks:
  backend-network:
    driver: bridge