services:

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    restart: always

    environment:
      # API доступ з браузера (через NGINX буде /api)
      NEXT_PUBLIC_API_URL: http://localhost/api

      # внутрішній URL для SSR (Docker network)
      BACKEND_URL: http://backend:5000

      WATCHPACK_POLLING: "true"

    expose:
      - "3000"

    networks:
      - frontend-network

    develop:
      watch:
        # 1. Слідкуємо за package.json для повної перезбірки (якщо додали новий npm-пакет)
        - path: ../../frontend/
          action: rebuild
          ignore:
            - node_modules/           # шлях вказується ВІДНОСНО папки 'path'
            - .next/

#        # 2. Слідкуємо за ВСІЄЇ папкою frontend для швидкої синхронізації коду
#        - path: ../../frontend
#          target: /app                # копіюємо в корінь додатка в контейнері
#          action: rebuild
#          ignore:
#            - node_modules/           # шлях вказується ВІДНОСНО папки 'path'
#            - .next/                  # шлях вказується ВІДНОСНО папки 'path'

    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M
#    deploy:
#      mode: replicated
#      replicas: 2
#      endpoint_mode: vip
#      resources:
#        limits:
#          cpus: '0.05'
#          memory: 256M


networks:
  frontend-network:
    driver: bridge