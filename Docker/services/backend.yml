services:

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    restart: always

    environment:
      PORT: 5000

      # DATABASE
      DB_HOST: cloth-shop-db
      DB_PORT: 3306

      # ELASTICSEARCH
      ES_HOST: http://elasticsearch:9200

      # REDIS
      REDIS_HOST: redis

      # KAFKA
      KAFKA_BROKER: kafka:9092

    expose:
      - "5000"

    networks:
      - backend-network

    develop:
      watch:
        # 1. Слідкуємо за package.json для повної перезбірки (якщо додали новий npm-пакет)
        - path: ../../backend/package.json
          action: rebuild

        # 2. Слідкуємо за ВСІЄЇ папкою backend для швидкої синхронізації коду
        - path: ../../backend/
          target: /app                # копіюємо в корінь додатка в контейнері
          action: sync
          ignore:
            - node_modules/           # шлях вказується ВІДНОСНО папки 'path'


networks:
  backend-network:
    driver: bridge